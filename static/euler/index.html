<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Euler — Mathematics, step by step</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- KaTeX for crisp math rendering. Degrades gracefully to plain text if it
     fails to load (offline) — the markdown still renders either way. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

<link rel="stylesheet" href="/static/shared/convo-history.css">

<style>
/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root {
  --paper:   #F4F1E8;
  --paper2:  #ECE7D9;
  --card:    #FBFAF4;
  --ink:     #1A1A22;
  --ink2:    #3C3C46;
  --ink3:    #6E6E78;
  --rule:    rgba(26,26,34,.12);
  --rule2:   rgba(26,26,34,.06);
  --hue:     #3B4C8A;        /* Euler — scholarly indigo */
  --hue2:    #5A6CB0;
  --hue-soft:rgba(59,76,138,.10);
  --hue-line:rgba(59,76,138,.26);
  --gold:    #B07B2E;
  --grid:    rgba(59,76,138,.07);
  --radius:  11px;
  --sidebar-w: 268px;
}
[data-theme="dark"] {
  --paper:  #14141A;
  --paper2: #1B1B22;
  --card:   #1E1E27;
  --ink:    #F1EEE5;
  --ink2:   #C7C3B9;
  --ink3:   #87838C;
  --rule:   rgba(241,238,229,.11);
  --rule2:  rgba(241,238,229,.05);
  --hue:    #8FA0E0;
  --hue2:   #6F82CC;
  --hue-soft:rgba(143,160,224,.13);
  --hue-line:rgba(143,160,224,.30);
  --gold:   #D8A24E;
  --grid:   rgba(143,160,224,.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
textarea { font: inherit; color: inherit; background: none; border: none; outline: none; resize: none; }
a { color: inherit; text-decoration: none; }
.serif { font-family: 'Newsreader', Georgia, serif; }
.sc { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }

/* ── Shell ──────────────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; }

/* ── Sidebar ────────────────────────────────────────────────────────────── */
.side {
  border-right: 1px solid var(--rule);
  background: var(--paper2);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.brand {
  padding: 22px 22px 18px;
  border-bottom: 1px solid var(--rule);
}
.brand-mark {
  width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--hue); color: #fff;
  font-family: 'Newsreader', serif; font-style: italic; font-size: 26px; font-weight: 600;
  box-shadow: 0 6px 18px var(--hue-soft);
  margin-bottom: 13px;
}
.brand-name { font-family: 'Newsreader', serif; font-size: 27px; font-weight: 600; line-height: 1; }
.brand-name em { font-style: italic; color: var(--hue); }
.brand-role { margin-top: 5px; font-size: 11.5px; color: var(--ink3); }
.brand-identity {
  margin-top: 14px; padding: 9px 12px;
  background: var(--card); border: 1px solid var(--rule);
  border-radius: 9px;
  font-family: 'Newsreader', serif; font-size: 17px; text-align: center; color: var(--ink2);
  letter-spacing: .02em;
}

.side-section { padding: 16px 16px 4px; }
.side-section + .side-section { padding-top: 8px; }
.topic {
  display: flex; align-items: flex-start; gap: 11px;
  width: 100%; text-align: left;
  padding: 10px 12px; border-radius: 9px;
  border: 1px solid transparent;
  transition: background .15s, border-color .15s, transform .15s;
}
.topic:hover { background: var(--card); border-color: var(--rule); transform: translateX(2px); }
.topic-glyph {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--hue-soft); color: var(--hue);
  font-family: 'Newsreader', serif; font-style: italic; font-size: 17px;
}
.topic-body { min-width: 0; }
.topic-name { display: block; font-weight: 600; font-size: 13px; }
.topic-desc { display: block; font-size: 11px; color: var(--ink3); margin-top: 1px; }

.side-foot { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; }
.foot-link { font-size: 11px; color: var(--ink3); display: inline-flex; gap: 6px; align-items: center; }
.foot-link:hover { color: var(--hue); }

/* ── Main ───────────────────────────────────────────────────────────────── */
.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 26px; border-bottom: 1px solid var(--rule);
  background: var(--paper);
}
.crumb { display: flex; align-items: baseline; gap: 9px; }
.crumb .here { font-family: 'Newsreader', serif; font-size: 18px; }
.crumb .sep { color: var(--ink3); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 9px;
  display: grid; place-items: center; color: var(--ink2);
  border: 1px solid var(--rule); background: var(--card);
  transition: border-color .15s, color .15s;
}
.icon-btn:hover { border-color: var(--hue-line); color: var(--hue); }

/* conversation */
.scroll {
  flex: 1; overflow-y: auto;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 26px 26px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 26px 26px,
    var(--paper);
}
.thread { max-width: 820px; margin: 0 auto; padding: 30px 26px 26px; display: flex; flex-direction: column; gap: 22px; }

.msg { display: flex; flex-direction: column; max-width: 100%; }
.msg.user { align-items: flex-end; }
.msg-meta { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); margin-bottom: 6px; }
.msg.user .msg-meta { color: var(--hue2); }
.bubble {
  border-radius: 13px;
  padding: 15px 19px;
  font-size: 14.5px;
}
.msg.user .bubble {
  background: var(--hue); color: #fff;
  border-radius: 13px 13px 4px 13px;
  max-width: 76%;
  white-space: pre-wrap;
}
.msg.euler .bubble {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 4px 13px 13px 13px;
  box-shadow: 0 2px 10px rgba(0,0,0,.03);
  width: 100%;
}

/* rendered markdown inside Euler replies */
.md { font-size: 14.5px; line-height: 1.7; color: var(--ink); font-family: 'Newsreader', Georgia, serif; }
.md p { margin: 0 0 11px; }
.md p:last-child { margin-bottom: 0; }
.md h2, .md h3 {
  font-family: 'Inter', sans-serif; font-weight: 700;
  margin: 18px 0 8px; line-height: 1.3;
}
.md h2 { font-size: 16px; }
.md h3 { font-size: 14px; color: var(--hue); }
.md h2:first-child, .md h3:first-child { margin-top: 0; }
.md strong { font-weight: 700; color: var(--ink); font-family: 'Inter', sans-serif; }
.md em { font-style: italic; }
.md ul, .md ol { margin: 0 0 11px; padding-left: 22px; }
.md li { margin: 3px 0; }
.md hr { border: none; border-top: 1px solid var(--rule); margin: 16px 0; }
.md blockquote {
  border-left: 3px solid var(--hue-line);
  padding: 2px 0 2px 14px; margin: 0 0 11px; color: var(--ink2); font-style: italic;
}
.md code {
  font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
  background: var(--hue-soft); color: var(--hue);
  padding: 1px 6px; border-radius: 5px;
}
.md pre {
  font-family: 'JetBrains Mono', monospace;
  background: var(--paper2); border: 1px solid var(--rule);
  border-left: 3px solid var(--hue-line);
  border-radius: 8px; padding: 13px 16px; margin: 0 0 12px;
  overflow-x: auto; font-size: 13px; line-height: 1.5; color: var(--ink);
}
.md pre code { background: none; color: inherit; padding: 0; }
.md .katex-display { margin: 12px 0; overflow-x: auto; overflow-y: hidden; }

.typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
.typing span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--hue);
  opacity: .5; animation: bob 1s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%,80%,100% { transform: translateY(0); opacity:.4 } 40% { transform: translateY(-5px); opacity:.9 } }

/* composer */
.composer { border-top: 1px solid var(--rule); background: var(--paper); padding: 14px 26px 18px; }
.composer-inner { max-width: 820px; margin: 0 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 11px; }
.chip {
  font-size: 12px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink2);
  transition: border-color .15s, color .15s, transform .15s;
}
.chip:hover { border-color: var(--hue-line); color: var(--hue); transform: translateY(-1px); }
.input-row {
  display: flex; align-items: flex-end; gap: 10px;
  background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
  padding: 10px 10px 10px 16px;
  transition: border-color .15s, box-shadow .15s;
}
.input-row:focus-within { border-color: var(--hue-line); box-shadow: 0 0 0 4px var(--hue-soft); }
.input-row textarea { flex: 1; max-height: 150px; line-height: 1.5; padding: 5px 0; }
.send {
  flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center; color: #fff; background: var(--hue);
  transition: opacity .15s, transform .15s;
}
.send:hover:not(:disabled) { transform: translateY(-1px); }
.send:disabled { opacity: .4; cursor: default; }
.composer-foot { display: flex; justify-content: space-between; margin-top: 9px; font-size: 10.5px; color: var(--ink3); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .msg.user .bubble { max-width: 88%; }
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="side">
    <div class="brand">
      <div class="brand-mark serif">e</div>
      <div class="brand-name serif">Eul<em>er</em></div>
      <div class="brand-role">Mathematics, step by step</div>
      <div class="brand-identity serif">e<sup>iπ</sup> + 1 = 0</div>
    </div>

    <div class="side-section">
      <div class="sc" style="padding:0 12px 8px">Topics</div>
      <button class="topic" onclick="quick('Walk me through integration by parts with a clear example, step by step.')">
        <span class="topic-glyph">∫</span>
        <span class="topic-body"><span class="topic-name">Calculus</span><span class="topic-desc">limits · derivatives · integrals · ODEs</span></span>
      </button>
      <button class="topic" onclick="quick('Explain eigenvalues and eigenvectors, and find them for a 2×2 matrix.')">
        <span class="topic-glyph">λ</span>
        <span class="topic-body"><span class="topic-name">Linear Algebra</span><span class="topic-desc">matrices · determinants · eigenvalues</span></span>
      </button>
      <button class="topic" onclick="quick('Explain the normal distribution and how to standardize a value into a z-score.')">
        <span class="topic-glyph">σ</span>
        <span class="topic-body"><span class="topic-name">Statistics &amp; Probability</span><span class="topic-desc">distributions · Bayes · regression</span></span>
      </button>
      <button class="topic" onclick="quick('Prove that the sum 1+2+...+n = n(n+1)/2 using mathematical induction.')">
        <span class="topic-glyph">∑</span>
        <span class="topic-body"><span class="topic-name">Discrete Math</span><span class="topic-desc">induction · combinatorics · number theory</span></span>
      </button>
    </div>

    <div class="side-foot">
      <a class="foot-link" href="/hub">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8 10 12.5"/></svg>
        all agents
      </a>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()" style="width:30px;height:30px"></button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div class="crumb">
        <span class="sc">Euler</span>
        <span class="sep">/</span>
        <span class="here serif">Mathematics tutor</span>
      </div>
      <div class="top-actions">
        <span class="sc" id="status">ready</span>
      </div>
    </header>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <div class="chips" id="chips">
          <button class="chip" onclick="quick('Solve ∫ x·eˣ dx and verify the result.')">∫ x·eˣ dx</button>
          <button class="chip" onclick="quick('Find the limit of sin(x)/x as x → 0 and explain why.')">lim sin(x)/x</button>
          <button class="chip" onclick="quick('Solve the differential equation dy/dx = 2xy.')">dy/dx = 2xy</button>
          <button class="chip" onclick="quick('What is Bayes theorem? Give an intuitive example.')">Bayes theorem</button>
        </div>
        <div class="input-row">
          <textarea id="ta" rows="1" placeholder="Ask Euler a math problem — he'll work it step by step…"
            oninput="resize(this)" onkeydown="onKey(event)"></textarea>
          <button class="send" id="send" onclick="send()" title="Send (Enter)" aria-label="Send">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8 14 2 11 14 8 9z"/></svg>
          </button>
        </div>
        <div class="composer-foot">
          <span>↵ send · ⇧↵ new line</span>
          <span id="footR">step-by-step · verified</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/shared/convo-history.js"></script>
<script>
/* ── theme ─────────────────────────────────────────────────────────────── */
const SUN = '<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 3v1.6M10 15.4V17M3 10h1.6M15.4 10H17M5.2 5.2l1.1 1.1M13.7 13.7l1.1 1.1M5.2 14.8l1.1-1.1M13.7 6.3l1.1-1.1"/></svg>';
const MOON = '<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M16.5 12a6 6 0 1 1-8.5-8.5 5 5 0 0 0 8.5 8.5z"/></svg>';
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); document.getElementById('themeBtn').innerHTML = t === 'dark' ? SUN : MOON; localStorage.setItem('euler-theme', t); }
function toggleTheme(){ applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
applyTheme(localStorage.getItem('euler-theme') || 'light');

/* ── tiny markdown renderer (input already HTML-escaped) ───────────────── */
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderMarkdown(src){
  let t = escapeHtml(src);
  const blocks = [];
  t = t.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, c) => { blocks.push(c); return `␀PRE${blocks.length-1}␀`; });
  t = t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
    .replace(/^##\s+(.+)$/gm, '<h2>$1</h2>')
    .replace(/^#\s+(.+)$/gm, '<h2>$1</h2>')
    .replace(/^\s*&gt;\s+(.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^\s*[-*]\s+(.+)$/gm, '<li>$1</li>')
    .replace(/^\s*\d+\.\s+(.+)$/gm, '<li data-ol="1">$1</li>')
    .replace(/^\s*---\s*$/gm, '<hr/>');
  // wrap consecutive <li>
  t = t.replace(/(<li(?: data-ol="1")?>[\s\S]*?<\/li>)(?:\n?(?=<li))?/g, m => m);
  t = t.replace(/((?:<li data-ol="1">.*?<\/li>\s*)+)/g, m => '<ol>' + m.replace(/ data-ol="1"/g,'') + '</ol>');
  t = t.replace(/((?:<li>.*?<\/li>\s*)+)/g, m => m.includes('<ol>') ? m : '<ul>' + m + '</ul>');
  // paragraphs
  t = t.split(/\n{2,}/).map(chunk => {
    const c = chunk.trim();
    if (!c) return '';
    if (/^<(h2|h3|ul|ol|hr|blockquote|pre)/.test(c) || c.startsWith('␀PRE')) return c;
    return '<p>' + c.replace(/\n/g, '<br/>') + '</p>';
  }).join('\n');
  t = t.replace(/␀PRE(\d+)␀/g, (_, i) => '<pre><code>' + blocks[+i] + '</code></pre>');
  return t;
}
function typesetMath(el){
  if (typeof window.renderMathInElement === 'function') {
    try {
      window.renderMathInElement(el, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
        ],
        throwOnError: false,
      });
    } catch (e) { /* leave plain text */ }
  }
}

/* ── conversation ──────────────────────────────────────────────────────── */
const thread = document.getElementById('thread');
const scroll = document.getElementById('scroll');
function now(){ const n = new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
function scrollDown(){ scroll.scrollTop = scroll.scrollHeight; }

function addUser(text){
  const m = document.createElement('div'); m.className = 'msg user';
  m.innerHTML = '<div class="msg-meta">You · ' + now() + '</div><div class="bubble"></div>';
  m.querySelector('.bubble').textContent = text;
  thread.appendChild(m); scrollDown();
}
function addEuler(text){
  const m = document.createElement('div'); m.className = 'msg euler';
  const body = document.createElement('div'); body.className = 'bubble';
  const md = document.createElement('div'); md.className = 'md';
  md.innerHTML = renderMarkdown(text);
  body.appendChild(md);
  m.innerHTML = '<div class="msg-meta">Euler · ' + now() + '</div>';
  m.appendChild(body);
  thread.appendChild(m);
  typesetMath(md);
  scrollDown();
  return m;
}
function showTyping(){
  const m = document.createElement('div'); m.className = 'msg euler'; m.id = 'typing';
  m.innerHTML = '<div class="msg-meta">Euler</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  thread.appendChild(m); scrollDown();
}
function hideTyping(){ const t = document.getElementById('typing'); if (t) t.remove(); }

let busy = false;
async function send(){
  if (busy) return;
  const ta = document.getElementById('ta');
  const text = ta.value.trim(); if (!text) return;
  ta.value = ''; ta.style.height = 'auto';
  const chips = document.getElementById('chips'); if (chips) chips.style.display = 'none';
  busy = true;
  document.getElementById('send').disabled = true;
  document.getElementById('status').textContent = 'thinking…';
  document.getElementById('footR').textContent = 'Euler is working…';
  addUser(text);
  showTyping();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, agent: 'euler' }),
    });
    const data = await res.json();
    hideTyping();
    addEuler(data.response || data.detail || '(no response)');
  } catch (e) {
    hideTyping();
    addEuler('⚠ Connection error: ' + String(e.message || e));
  } finally {
    busy = false;
    document.getElementById('send').disabled = false;
    document.getElementById('status').textContent = 'ready';
    document.getElementById('footR').textContent = 'step-by-step · verified';
    document.getElementById('ta').focus();
  }
}
function quick(text){ const ta = document.getElementById('ta'); ta.value = text; send(); }
function onKey(e){ if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } }
function resize(ta){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 150) + 'px'; }

/* greeting */
addEuler("Welcome. I am **Leonhard Euler** — let us reason through mathematics together, *one clear step at a time*.\n\nBring me a problem from calculus, linear algebra, statistics, probability, or discrete math. I will:\n\n- **Understand** the problem precisely\n- **Choose** the most elegant method\n- Show **every step** — never skipping\n- **Verify** the result, and explain the intuition behind it\n\nWhat shall we work on today?");

/* conversation history widget */
ConvoHistory.mount({ agent: 'euler', label: 'Euler', accent: '#3B4C8A' });

document.getElementById('ta').focus();
</script>
</body>
</html>
