<style>/* ─────────────────────────────────────────── Tokens */
:root,
[data-theme="light"] {
  --paper:        #F2ECE0;
  --paper-2:      #EBE4D5;
  --paper-3:      #E3DBC9;
  --surface:      #FAF6EC;
  --surface-2:    #FFFCF4;

  --ink:          #1A1612;
  --ink-2:        #3A322B;
  --ink-3:        #6C6359;
  --ink-4:        #9D9388;
  --ink-5:        #C6BDB0;

  --rule:         rgba(26,22,18,0.12);
  --rule-soft:    rgba(26,22,18,0.06);
  --hover:        rgba(26,22,18,0.04);

  --accent:       #6B4D6E;
  --accent-2:     #7A5780;
  --accent-soft:  rgba(107,77,110,0.10);
  --accent-line:  rgba(107,77,110,0.26);

  --positive:     #4B6B4F;
  --negative:     #9F4F3D;
  --neutral:      #B07B3A;

  --shadow-1: 0 1px 0 rgba(26,22,18,0.04);
  --shadow-2: 0 8px 30px -12px rgba(26,22,18,0.18);
}
[data-theme="dark"] {
  --paper:        #15120E;
  --paper-2:      #1B1813;
  --paper-3:      #221E17;
  --surface:      #1A1612;
  --surface-2:    #221E17;

  --ink:          #EEE4D2;
  --ink-2:        #C9BFAC;
  --ink-3:        #8E8475;
  --ink-4:        #635A4E;
  --ink-5:        #3B362E;

  --rule:         rgba(238,228,210,0.12);
  --rule-soft:    rgba(238,228,210,0.06);
  --hover:        rgba(238,228,210,0.04);

  --accent:       #C09BC4;
  --accent-2:     #D5B5DA;
  --accent-soft:  rgba(192,155,196,0.10);
  --accent-line:  rgba(192,155,196,0.30);

  --positive:     #87B084;
  --negative:     #D08571;
  --neutral:      #D7AD72;

  --shadow-2: 0 8px 30px -12px rgba(0,0,0,0.6);
}
[data-accent="rust"]   { --accent:#9F4F3D; --accent-2:#A95846; --accent-soft:rgba(159,79,61,0.10); --accent-line:rgba(159,79,61,0.28); }
[data-accent="forest"] { --accent:#3F5D45; --accent-2:#4A6B50; --accent-soft:rgba(63,93,69,0.10);  --accent-line:rgba(63,93,69,0.30); }
[data-accent="ink"]    { --accent:var(--ink); --accent-2:var(--ink-2); --accent-soft:var(--hover); --accent-line:var(--rule); }

/* ─────────────────────────────────────────── Reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Söhne', 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 320ms ease, color 320ms ease;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-4); background-clip: padding-box; border: 2px solid transparent; }

.serif { font-family: 'Newsreader', 'Instrument Serif', Georgia, serif; font-variation-settings: "opsz" 16; }
.mono  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
.sc    {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-3);
}

/* ─────────────────────────────────────────── App */
.app {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ─────────────────────────────────────────── Sidebar */
.sidebar {
  display: flex;
  flex-direction: column;
  background: var(--paper-2);
  border-right: 1px solid var(--rule);
  overflow: hidden;
  min-width: 0;
}
.side-pad { padding-left: 22px; padding-right: 18px; }

.side-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-top: 22px;
  padding-bottom: 18px;
}
.brand-mark {
  width: 36px; height: 36px;
  border-radius: 6px;
  background: var(--ink);
  color: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
}
[data-theme="dark"] .brand-mark { background: var(--accent); color: var(--paper); }
.brand-stack { line-height: 1.1; }
.brand-line {
  font-family: 'Instrument Serif', serif;
  font-size: 24px;
  font-weight: 400;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.brand-line em { color: var(--accent); font-style: italic; }
.brand-meta { margin-top: 4px; font-size: 9px; letter-spacing: 0.16em; }

/* Streak banner */
.streak-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-top: 18px;
  padding-bottom: 20px;
  border-top: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
}
.streak-left {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-shrink: 0;
}
.streak-num {
  font-family: 'Instrument Serif', serif;
  font-size: 48px;
  line-height: 0.9;
  color: var(--ink);
  font-weight: 400;
  letter-spacing: -0.02em;
}
.streak-label { line-height: 1.25; }
.streak-label .sc { font-size: 9px; color: var(--ink-3); }
.streak-sub { font-size: 10px; color: var(--ink-4); margin-top: 2px; }
.streak-pips {
  display: flex;
  gap: 4px;
  align-items: flex-end;
  margin-left: auto;
}
.streak-pips .pip {
  display: block;
  width: 4px; height: 20px; border-radius: 1px;
  background: var(--ink-5);
  opacity: 0.85;
}
.streak-pips .pip:last-child { height: 28px; }
.streak-pips .pip.positive { background: var(--positive); }
.streak-pips .pip.negative { background: var(--negative); }
.streak-pips .pip.neutral  { background: var(--neutral); }
.streak-pips .pip.empty    { background: var(--rule); }

/* Week strip */
.week-strip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  padding-top: 14px;
  padding-bottom: 14px;
}
.week-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 0 8px;
  border-radius: 6px;
  color: var(--ink-3);
  transition: background 160ms, color 160ms;
}
.week-cell:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.week-cell:disabled { cursor: default; }
.week-cell.is-future { opacity: 0.3; }
.week-cell.has-entry { color: var(--ink-2); }
.week-cell.is-today {
  background: var(--ink);
  color: var(--surface-2);
}
[data-theme="dark"] .week-cell.is-today { background: var(--accent); color: var(--paper); }
.week-cell.is-today .week-letter { opacity: 0.7; }
.week-cell.is-active:not(.is-today) {
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent-line);
}
.week-letter {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.06em;
  opacity: 0.8;
}
.week-num {
  font-family: 'Instrument Serif', serif;
  font-size: 18px;
  line-height: 1;
}
.week-dot {
  position: absolute;
  bottom: 3px;
  width: 4px; height: 4px;
  border-radius: 50%;
}
.week-cell.is-today .week-dot { background: var(--surface-2) !important; opacity: 0.7; }
.week-dot.positive { background: var(--positive); }
.week-dot.negative { background: var(--negative); }
.week-dot.neutral  { background: var(--neutral); }

/* Search */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 14px;
  padding-bottom: 14px;
  border-top: 1px solid var(--rule-soft);
}
.search-ico { color: var(--ink-4); display: flex; }
.search-input {
  flex: 1;
  background: transparent;
  border: 0;
  outline: 0;
  font-size: 13px;
  color: var(--ink);
}
.search-input::placeholder { color: var(--ink-4); }
.search-clear {
  font-size: 16px;
  color: var(--ink-4);
  padding: 0 4px;
  line-height: 1;
}
.search-clear:hover { color: var(--ink); }

/* Entry list */
.entry-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0 8px;
  border-top: 1px solid var(--rule-soft);
}
.entry-group { padding: 6px 0 4px; }
.entry-group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 22px 6px;
  position: sticky;
  top: 0;
  background: linear-gradient(var(--paper-2) 70%, transparent);
  z-index: 2;
}
.entry-group-head .sc:first-child { color: var(--ink-2); letter-spacing: 0.18em; }
.entry-group-count {
  font-size: 9px;
  color: var(--ink-4);
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--paper-3);
}
.entry-row {
  width: 100%;
  display: flex;
  gap: 0;
  padding: 10px 18px 12px 22px;
  text-align: left;
  position: relative;
  transition: background 160ms;
  border-radius: 0;
}
.entry-row:hover { background: var(--hover); }
.entry-row.active {
  background: var(--surface-2);
  box-shadow: inset 0 1px 0 var(--rule-soft), inset 0 -1px 0 var(--rule-soft);
}
[data-theme="dark"] .entry-row.active { background: var(--paper-3); }
.entry-stripe {
  width: 2px;
  margin-right: 12px;
  border-radius: 2px;
  background: transparent;
  flex-shrink: 0;
}
.entry-row.active .entry-stripe { background: var(--accent); }
.entry-row.active .entry-stripe.positive { background: var(--positive); }
.entry-row.active .entry-stripe.negative { background: var(--negative); }
.entry-row.active .entry-stripe.neutral  { background: var(--neutral); }
.entry-body { flex: 1; min-width: 0; }
.entry-date-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}
.entry-num {
  font-family: 'Instrument Serif', serif;
  font-size: 18px;
  line-height: 1;
  color: var(--ink);
  font-weight: 400;
}
.entry-day {
  font-size: 9px;
  color: var(--ink-4);
}
.today-tag {
  margin-left: auto;
  font-size: 9px;
  background: var(--accent);
  color: var(--surface-2);
  padding: 2px 7px;
  border-radius: 20px;
  letter-spacing: 0.12em;
}
[data-theme="dark"] .today-tag { color: var(--paper); }
.entry-preview {
  font-family: 'Newsreader', serif;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--ink-2);
  margin-top: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-wrap: pretty;
}
.entry-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 6px;
}
.mood-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: lowercase;
  padding: 1.5px 7px;
  border-radius: 10px;
  background: var(--paper-3);
  color: var(--ink-3);
}
.mood-positive { color: var(--positive); background: color-mix(in srgb, var(--positive) 12%, transparent); }
.mood-negative { color: var(--negative); background: color-mix(in srgb, var(--negative) 12%, transparent); }
.mood-neutral  { color: var(--neutral);  background: color-mix(in srgb, var(--neutral) 12%, transparent); }
.entry-words { font-size: 9px; color: var(--ink-4); }

.entry-empty {
  padding: 32px 22px;
  text-align: center;
  color: var(--ink-3);
}

/* Sidebar footer */
.side-foot {
  border-top: 1px solid var(--rule-soft);
  padding-top: 12px;
  padding-bottom: 14px;
}
.foot-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-4);
  transition: color 160ms;
}
.foot-link:hover { color: var(--accent); }

/* ─────────────────────────────────────────── Main */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--paper);
  overflow: hidden;
}

/* Topbar */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
  background: var(--paper);
}
.top-l { display: flex; align-items: baseline; gap: 12px; }
.top-crumb { color: var(--ink-3); }
.top-sep { color: var(--ink-4); font-size: 12px; }
.top-here {
  font-size: 16px;
  font-style: italic;
  color: var(--ink);
  white-space: nowrap;
}
.top-r { display: flex; align-items: center; gap: 8px; }
.top-saved {
  color: var(--ink-4);
  padding-right: 10px;
  border-right: 1px solid var(--rule);
  display: flex; align-items: center; gap: 6px;
}
.top-saved::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--positive);
  display: inline-block;
}
.icon-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  color: var(--ink-3);
  transition: color 160ms, background 160ms;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }

/* ─────────────────────────────────────────── Page */
.page-scroll {
  flex: 1;
  overflow-y: auto;
  background: var(--paper);
}
.page-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 240px;
  gap: 48px;
  max-width: 1080px;
  margin: 0 auto;
  padding: 36px 32px 80px;
}
.page-wrap.layout-wide {
  grid-template-columns: minmax(0, 760px);
  justify-content: center;
}

/* Page article */
.page {
  position: relative;
  min-width: 0;
  overflow: visible;
}
.page-scroll { overflow-x: clip; }

/* Mood wash — subtle color overlay at top of page */
.page.wash-soft::before,
.page.wash-bold::before {
  content: '';
  position: absolute;
  top: -8px; left: -16px; right: -16px;
  height: 4px;
  border-radius: 4px;
  background: var(--ink-5);
}
.page.wash-soft.mood-positive::before { background: var(--positive); opacity: 0.7; }
.page.wash-soft.mood-negative::before { background: var(--negative); opacity: 0.7; }
.page.wash-soft.mood-neutral::before  { background: var(--neutral);  opacity: 0.7; }

.page.wash-bold::before { height: 6px; opacity: 1; }
.page.wash-bold.mood-positive::before { background: var(--positive); }
.page.wash-bold.mood-negative::before { background: var(--negative); }
.page.wash-bold.mood-neutral::before  { background: var(--neutral); }
.page.wash-bold::after {
  content: '';
  position: absolute;
  top: -8px; left: -16px; right: -16px; height: 140px;
  background: linear-gradient(to bottom, currentColor, transparent);
  opacity: 0.04;
  pointer-events: none;
  z-index: 0;
}
.page.wash-bold.mood-positive::after { color: var(--positive); }
.page.wash-bold.mood-negative::after { color: var(--negative); }
.page.wash-bold.mood-neutral::after  { color: var(--neutral); }

/* Page header */
.page-head { margin-bottom: 28px; position: relative; z-index: 1; }
.page-head-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0 16px;
  border-bottom: 1px solid var(--rule-soft);
}
.page-head-date {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-2);
  letter-spacing: 0.16em;
}
.page-head-meta { color: var(--ink-4); }
.mood-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); }
.mood-dot.positive { background: var(--positive); }
.mood-dot.negative { background: var(--negative); }
.mood-dot.neutral  { background: var(--neutral); }

.page-title {
  margin-top: 28px;
  font-family: 'Instrument Serif', serif;
  font-weight: 400;
  font-size: 56px;
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.page-title-num {
  color: var(--ink-4);
  font-style: italic;
  font-size: 38px;
}

/* Page body */
.page-body {
  font-family: 'Newsreader', serif;
  font-variation-settings: "opsz" 18;
  font-size: 19px;
  line-height: 1.72;
  color: var(--ink-2);
  text-wrap: pretty;
  position: relative;
  z-index: 1;
}
.page-content .dropcap {
  font-family: 'Instrument Serif', serif;
  font-size: 4.6em;
  float: left;
  line-height: 0.86;
  margin-right: 10px;
  margin-top: 6px;
  margin-bottom: -4px;
  color: var(--accent);
  font-weight: 400;
  letter-spacing: -0.02em;
}
.page-content p { margin-bottom: 1em; }
.page-content p:last-child { margin-bottom: 0; }
.page-content h2 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  font-weight: 500;
  margin: 32px 0 12px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.page-content h2::before,
.page-content h2::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--accent-line);
  opacity: 0.5;
}
.page-content h2::before { flex: 0 0 24px; }
.page-content h3 {
  font-family: 'Newsreader', serif;
  font-style: italic;
  font-size: 22px;
  font-weight: 400;
  color: var(--ink);
  margin: 24px 0 8px;
}
.page-content blockquote {
  border-left: 2px solid var(--accent-line);
  padding: 4px 0 4px 22px;
  margin: 24px 0;
  color: var(--ink);
  font-style: italic;
  font-size: 1.04em;
}
.page-content ul, .page-content ol {
  margin: 0 0 1em 1.4em;
  padding: 0;
}
.page-content ul { list-style: none; }
.page-content ul li {
  position: relative;
  padding-left: 8px;
  margin-bottom: 6px;
}
.page-content ul li::before {
  content: '·';
  position: absolute;
  left: -14px;
  color: var(--accent);
  font-size: 1.4em;
  line-height: 1;
}
.page-content strong { color: var(--ink); font-weight: 600; }
.page-content em { font-style: italic; color: var(--ink); }
.page-content hr {
  border: 0;
  border-top: 1px solid var(--rule-soft);
  margin: 24px 0;
}
.page-content code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.85em;
  background: var(--paper-2);
  padding: 1px 5px;
  border-radius: 3px;
}

/* Page footer */
.page-foot {
  margin-top: 56px;
  padding-top: 24px;
  border-top: 1px solid var(--rule-soft);
  text-align: center;
  color: var(--ink-4);
  letter-spacing: 0.3em;
}

/* Empty state */
.page-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--ink-3);
}
.page-empty-mark {
  font-family: 'Instrument Serif', serif;
  font-size: 72px;
  color: var(--accent);
  margin-bottom: 8px;
  line-height: 1;
}
.page-empty-title {
  font-family: 'Instrument Serif', serif;
  font-size: 30px;
  color: var(--ink);
  margin-bottom: 6px;
  font-style: italic;
}
.page-empty-sub { font-size: 14px; max-width: 360px; margin: 0 auto; line-height: 1.6; }

/* ─────────────────────────────────────────── Marginalia */
.margin {
  position: sticky;
  top: 40px;
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 28px;
  padding-top: 16px;
}
.margin-block {
  padding-left: 16px;
  border-left: 1px solid var(--rule);
}
.margin-label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  color: var(--ink-3);
}
.margin-r { color: var(--accent); display: inline-flex; }
.margin-mood {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 24px;
  color: var(--ink);
  text-transform: lowercase;
  line-height: 1;
  margin-bottom: 8px;
}
.mood-bar {
  height: 3px;
  border-radius: 3px;
  background: var(--ink-5);
  width: 60%;
}
.mood-bar.positive { background: var(--positive); width: 75%; }
.mood-bar.negative { background: var(--negative); width: 35%; }
.mood-bar.neutral  { background: var(--neutral);  width: 55%; }

.margin-themes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.theme-tag {
  font-family: 'Newsreader', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--ink-2);
  padding: 2px 10px;
  border-radius: 30px;
  background: var(--surface-2);
  border: 1px solid var(--rule);
}
[data-theme="dark"] .theme-tag { background: var(--paper-3); }

.margin-q .margin-label { color: var(--accent); }
.margin-question {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 10px 12px 10px 0;
  border-top: 1px solid var(--rule-soft);
  color: var(--ink-2);
  transition: color 160ms;
}
.margin-question:last-child { border-bottom: 1px solid var(--rule-soft); }
.margin-question .serif {
  font-size: 15px;
  font-style: italic;
  line-height: 1.4;
}
.margin-q-arrow {
  color: var(--ink-4);
  flex-shrink: 0;
  margin-top: 4px;
  transition: transform 200ms, color 200ms;
}
.margin-question:hover { color: var(--accent); }
.margin-question:hover .margin-q-arrow { color: var(--accent); transform: translateX(3px); }

.margin-related { margin-bottom: 12px; }
.margin-related:last-child { margin-bottom: 0; }
.margin-rel-date { color: var(--ink-4); margin-bottom: 2px; font-size: 9px; }
.margin-rel-preview {
  font-family: 'Newsreader', serif;
  font-size: 13.5px;
  font-style: italic;
  color: var(--ink-2);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ─────────────────────────────────────────── Composer */
.composer {
  background: var(--surface);
  border-top: 1px solid var(--rule);
  padding: 14px 32px 16px;
  flex-shrink: 0;
  transition: background 200ms;
}
.composer.open { background: var(--surface-2); }

.composer-chips {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.chip {
  padding: 4px 12px;
  font-size: 12px;
  color: var(--ink-2);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 30px;
  transition: all 160ms;
  font-family: 'Newsreader', serif;
  font-style: italic;
}
.chip:hover {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent);
}

.composer-row {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  background: transparent;
}
.composer-r {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
  margin-bottom: 4px;
}
.composer-ta {
  flex: 1;
  background: transparent;
  border: 0;
  outline: 0;
  font-family: 'Newsreader', serif;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  resize: none;
  min-height: 32px;
  padding: 6px 0;
}
.composer-ta::placeholder {
  color: var(--ink-3);
  font-style: italic;
}
.composer-send {
  width: 36px; height: 36px;
  background: var(--accent);
  color: var(--surface-2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 160ms, transform 160ms;
  flex-shrink: 0;
}
[data-theme="dark"] .composer-send { color: var(--paper); }
.composer-send:hover:not(:disabled) { transform: translateY(-1px); }
.composer-send:disabled { opacity: 0.3; cursor: default; }

.composer-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  color: var(--ink-4);
  font-size: 9px;
}

/* Loading dots */
.dots { display: inline-flex; gap: 4px; }
.dots span {
  width: 4px; height: 4px; border-radius: 50%;
  background: currentColor;
  animation: blink 1.2s infinite;
}
.dots span:nth-child(2) { animation-delay: 0.15s; }
.dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

/* ─────────────────────────────────────────── Chat drawer */
.chat-drawer {
  position: fixed;
  top: 0; right: 0;
  width: 380px;
  height: 100vh;
  background: var(--surface-2);
  border-left: 1px solid var(--rule);
  box-shadow: var(--shadow-2);
  display: flex;
  flex-direction: column;
  z-index: 50;
  animation: slideIn 280ms cubic-bezier(0.2,0.7,0.2,1);
}
@keyframes slideIn {
  from { transform: translateX(20px); opacity: 0; }
  to   { transform: translateX(0);   opacity: 1; }
}
.chat-drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
  border-bottom: 1px solid var(--rule);
}
.chat-drawer-head .icon-btn { font-size: 18px; color: var(--ink-3); }
.chat-drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.chat-msg.user { align-self: flex-end; max-width: 86%; text-align: right; }
.chat-msg.agent { align-self: flex-start; max-width: 92%; }
.chat-msg-author { margin-bottom: 4px; font-size: 9px; }
.chat-msg-body {
  font-family: 'Newsreader', serif;
  font-size: 15px;
  line-height: 1.55;
  padding: 10px 14px;
  border-radius: 14px;
  color: var(--ink);
}
.chat-msg.user .chat-msg-body {
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--accent-line);
  border-radius: 14px 14px 4px 14px;
}
.chat-msg.agent .chat-msg-body {
  background: var(--paper-2);
  border: 1px solid var(--rule-soft);
  border-radius: 14px 14px 14px 4px;
  font-style: italic;
}
.chat-empty {
  text-align: center;
  padding: 40px 0;
  color: var(--ink-4);
}

/* ── Drawer header actions + history list ── */
.chat-drawer-actions { display: flex; align-items: center; gap: 6px; }
.history-body { gap: 10px; }
.convo-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  text-align: left;
  padding: 13px 15px;
  background: var(--paper-2);
  border: 1px solid var(--rule-soft);
  border-radius: 13px;
  cursor: pointer;
  transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
}
.convo-card:hover {
  border-color: var(--accent-line);
  transform: translateY(-1px);
  box-shadow: var(--shadow-1);
}
.convo-card.is-active {
  border-color: var(--accent-line);
  background: var(--accent-soft);
}
.convo-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.convo-card-date { color: var(--accent); font-size: 9px; }
.convo-card-count { color: var(--ink-4); font-size: 9px; }
.convo-card-title {
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
}
.convo-card-reopen {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  color: var(--ink-3);
  opacity: 0;
  transition: opacity 160ms ease, color 160ms ease;
}
.convo-card:hover .convo-card-reopen { opacity: 1; color: var(--accent); }

/* ─────────────────────────────────────────── Responsive-ish */
@media (max-width: 880px) {
  .page-wrap { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 28px 24px 60px; }
  .margin { display: none; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: 280px 1fr; }
  .chat-drawer { width: 320px; }
}
</style>

<div id="root"></div>

<script src="/static/journal/vendor/react.js"></script>
<script src="/static/journal/vendor/react-dom.js"></script>
<script src="/static/journal/vendor/babel.js"></script>
<script src="/static/journal/data.js"></script>
<script>
(async function () {
  try {
    await window.loadJournalData();
  } catch (e) {
    console.error('[journal] data load failed', e);
    if (!window.JOURNAL_DATA) window.JOURNAL_DATA = { entries: [], today: null, streak: 0, total_entries: 0, this_month_count: 0, mood_history: [], TODAY: new Date(), DAYS_ID: ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'], MONTHS_ID: ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'], ymd: (d) => d.toISOString().slice(0,10) };
  }
  for (const url of ['/static/journal/tweaks.jsx', '/static/journal/app.jsx']) {
    try {
      const code = await (await fetch(url)).text();
      const s = document.createElement('script');
      s.type = 'text/babel';
      s.textContent = code;
      document.body.appendChild(s);
    } catch (e) { console.error('[journal] failed loading ' + url, e); }
  }
  if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
    window.Babel.transformScriptTags();
  } else {
    console.error('[journal] Babel standalone not available');
  }
})();
</script>
