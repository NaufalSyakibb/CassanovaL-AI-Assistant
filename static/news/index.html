<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Najwa — Newsroom 24/7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #09090b;
  --panel:    #0f0f13;
  --panel2:   #15151b;
  --border:   #1e1e28;
  --border2:  #2a2a38;
  --text:     #e2e2ea;
  --text2:    #8888a8;
  --text3:    #48485e;
  --accent:   #e03030;
  --accent2:  rgba(224,48,48,0.10);
  --shadow:   0 4px 24px rgba(0,0,0,0.6);
  --world:    #4488ee; --world-bg: rgba(68,136,238,0.12);
  --tech:     #22aacc; --tech-bg:  rgba(34,170,204,0.12);
  --biz:      #ee8822; --biz-bg:   rgba(238,136,34,0.12);
  --indo:     #44bb66; --indo-bg:  rgba(68,187,102,0.12);
  --breaking-bg: rgba(224,48,48,0.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',ui-sans-serif,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── TOP BAR ── */
#topbar{
  display:flex;align-items:center;height:44px;
  background:var(--panel);border-bottom:2px solid var(--accent);
  padding:0 18px;gap:14px;flex-shrink:0;
}
.tb-brand{display:flex;align-items:center;gap:10px}
.tb-live-dot{
  width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px var(--accent);animation:glow 1.6s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:1;box-shadow:0 0 10px var(--accent)}50%{opacity:.4;box-shadow:0 0 4px var(--accent)}}
.tb-name{font-family:'IBM Plex Serif',serif;font-size:18px;font-weight:600;color:var(--text);letter-spacing:.01em}
.tb-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.1em;padding-left:2px}
.tb-live{
  display:flex;align-items:center;gap:5px;
  padding:2px 9px;border-radius:3px;
  background:var(--accent2);border:1px solid rgba(224,48,48,.35);
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:.1em;
}
.tb-live-blink{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
.tb-sp{flex:1}
#tb-clock{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text2);letter-spacing:.04em}
.tb-back{
  display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:5px;
  border:1px solid var(--border2);background:transparent;
  color:var(--text2);font-size:11px;font-family:'IBM Plex Mono',monospace;
  cursor:pointer;text-decoration:none;letter-spacing:.05em;transition:all .15s;
}
.tb-back:hover{border-color:var(--accent);color:var(--accent)}

/* ── TICKER ── */
#ticker{
  height:32px;background:var(--panel2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;flex-shrink:0;overflow:hidden;
}
.tick-label{
  padding:0 14px;height:100%;display:flex;align-items:center;
  background:var(--accent);color:#fff;flex-shrink:0;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.12em;
}
.tick-track{flex:1;overflow:hidden;position:relative}
.tick-inner{
  display:flex;white-space:nowrap;align-items:center;height:32px;
  animation:scroll 80s linear infinite;
}
.tick-inner:hover{animation-play-state:paused}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.tick-item{
  display:inline-flex;align-items:center;gap:7px;
  padding:0 22px;border-right:1px solid var(--border2);
  font-size:11px;
}
.tick-cat{
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;
  padding:1px 5px;border-radius:2px;letter-spacing:.05em;flex-shrink:0;
}
.tc-breaking{background:rgba(224,48,48,.2);color:#ff6655}
.tc-world{background:var(--world-bg);color:var(--world)}
.tc-technology{background:var(--tech-bg);color:var(--tech)}
.tc-business{background:var(--biz-bg);color:var(--biz)}
.tc-indonesia{background:var(--indo-bg);color:var(--indo)}
.tick-title{color:var(--text2)}

/* ── LAYOUT ── */
#wrap{display:flex;height:calc(100vh - 77px);overflow:hidden}

/* ── SIDEBAR ── */
#sb{
  width:224px;min-width:224px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sb-blk{padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-ttl{
  font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text3);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;
}
.sb-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.sb-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:glow 1.6s infinite;flex-shrink:0}
.sb-live-lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.05em}
.sb-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);margin-bottom:3px}
.sb-meta b{color:var(--text2);font-weight:400}

/* Filters */
.sb-filters{display:flex;flex-direction:column;gap:2px}
.flt{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 10px;border-radius:5px;border:none;
  background:transparent;cursor:pointer;
  font-size:12px;font-family:'Inter',sans-serif;color:var(--text2);
  transition:all .15s;text-align:left;
}
.flt:hover{background:var(--panel2);color:var(--text)}
.flt.on{background:var(--accent2);color:var(--accent)}
.flt-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.flt-n{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3)}
.flt.on .flt-n{color:var(--accent)}

/* Refresh */
.ref-bar-wrap{height:3px;background:var(--panel2);border-radius:2px;margin-top:8px;overflow:hidden}
.ref-bar{height:100%;background:var(--accent);border-radius:2px;transition:width 1s linear}
.ref-txt{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);margin-top:5px}
.ref-btn{
  display:flex;align-items:center;justify-content:center;gap:5px;
  width:100%;margin-top:8px;padding:5px 0;
  background:transparent;border:1px solid var(--border2);color:var(--text3);
  border-radius:4px;cursor:pointer;font-size:10px;
  font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;transition:all .15s;
}
.ref-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── FEED ── */
#feed{flex:1;overflow-y:auto;padding:18px 20px}

.feed-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.feed-cat{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.1em}
.feed-cnt{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3)}

/* Loading */
.loading{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:60vh;gap:16px;
}
.spin{
  width:32px;height:32px;border-radius:50%;
  border:2px solid var(--border2);border-top-color:var(--accent);
  animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:.1em}

/* Breaking hero */
.hero{
  display:block;text-decoration:none;
  background:var(--panel);border:1px solid rgba(224,48,48,.3);
  border-left:3px solid var(--accent);border-radius:7px;
  padding:16px 20px;margin-bottom:18px;transition:all .2s;
}
.hero:hover{background:rgba(224,48,48,.05);border-color:rgba(224,48,48,.5)}
.hero-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;
  color:var(--accent);letter-spacing:.12em;margin-bottom:9px;
}
.hero-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.hero-hl{
  font-family:'IBM Plex Serif',serif;font-size:18px;font-weight:600;
  color:var(--text);line-height:1.35;margin-bottom:7px;
}
.hero-snip{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:9px}
.hero-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3)}
.hero-meta b{color:var(--text2);font-weight:400}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(2,1fr)}}

/* Card */
.card{
  display:flex;flex-direction:column;text-decoration:none;
  background:var(--panel);border:1px solid var(--border);border-radius:7px;
  overflow:hidden;transition:all .2s;
}
.card:hover{border-color:var(--border2);background:var(--panel2);transform:translateY(-1px);box-shadow:var(--shadow)}
.card-img{width:100%;height:96px;object-fit:cover;background:var(--panel2);display:block;flex-shrink:0}
.card-body{padding:10px 13px 13px;flex:1;display:flex;flex-direction:column}
.card-cat{
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;
  padding:2px 6px;border-radius:2px;letter-spacing:.05em;
  display:inline-flex;align-self:flex-start;margin-bottom:7px;
}
.cc-breaking{background:rgba(224,48,48,.15);color:#ff6655}
.cc-world{background:var(--world-bg);color:var(--world)}
.cc-technology{background:var(--tech-bg);color:var(--tech)}
.cc-business{background:var(--biz-bg);color:var(--biz)}
.cc-indonesia{background:var(--indo-bg);color:var(--indo)}
.card-hl{
  font-family:'IBM Plex Serif',serif;font-size:13px;
  color:var(--text);line-height:1.4;margin-bottom:7px;flex:1;
}
.card-snip{
  font-size:11px;color:var(--text2);line-height:1.55;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-meta{
  display:flex;align-items:center;justify-content:space-between;
  font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text3);
}
.card-src{color:var(--text2)}

/* Empty */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:56px 24px;gap:8px;color:var(--text3);text-align:center;
  grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:11px;
}

/* Fade-in */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card,.hero{animation:fadeUp .35s ease both}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="tb-brand">
    <div class="tb-live-dot"></div>
    <span class="tb-name">Najwa</span>
    <span class="tb-sub">NEWSROOM 24/7</span>
  </div>
  <div class="tb-live"><div class="tb-live-blink"></div>LIVE</div>
  <div class="tb-sp"></div>
  <div id="tb-clock"></div>
  <a href="/" class="tb-back">← Agents</a>
</div>

<!-- TICKER -->
<div id="ticker">
  <div class="tick-label">BREAKING</div>
  <div class="tick-track">
    <div class="tick-inner" id="tick-inner">
      <span class="tick-item"><span class="tick-cat tc-breaking">LIVE</span><span class="tick-title">Connecting to live news feed...</span></span>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="wrap">

  <!-- SIDEBAR -->
  <div id="sb">
    <div class="sb-blk">
      <div class="sb-ttl">Status</div>
      <div class="sb-row"><div class="sb-dot"></div><span class="sb-live-lbl">LIVE FEED</span></div>
      <div class="sb-meta">Updated: <b id="sb-updated">—</b></div>
      <div class="sb-meta">Articles: <b id="sb-count">0</b></div>
    </div>

    <div class="sb-blk" style="flex:1;overflow-y:auto">
      <div class="sb-ttl">Topics</div>
      <div class="sb-filters">
        <button class="flt on" data-cat="all">
          <span class="flt-dot" style="background:var(--text3)"></span>All
          <span class="flt-n" id="fn-all">0</span>
        </button>
        <button class="flt" data-cat="breaking">
          <span class="flt-dot" style="background:#e03030"></span>Breaking
          <span class="flt-n" id="fn-breaking">0</span>
        </button>
        <button class="flt" data-cat="world">
          <span class="flt-dot" style="background:var(--world)"></span>World
          <span class="flt-n" id="fn-world">0</span>
        </button>
        <button class="flt" data-cat="technology">
          <span class="flt-dot" style="background:var(--tech)"></span>Technology
          <span class="flt-n" id="fn-technology">0</span>
        </button>
        <button class="flt" data-cat="business">
          <span class="flt-dot" style="background:var(--biz)"></span>Business
          <span class="flt-n" id="fn-business">0</span>
        </button>
        <button class="flt" data-cat="indonesia">
          <span class="flt-dot" style="background:var(--indo)"></span>Indonesia
          <span class="flt-n" id="fn-indonesia">0</span>
        </button>
      </div>
    </div>

    <div class="sb-blk">
      <div class="sb-ttl">Auto-Refresh</div>
      <div class="ref-bar-wrap"><div class="ref-bar" id="ref-bar" style="width:100%"></div></div>
      <div class="ref-txt" id="ref-txt">Next: 3:00</div>
      <button class="ref-btn" id="ref-btn">↻ REFRESH NOW</button>
    </div>
  </div>

  <!-- FEED -->
  <div id="feed">
    <div class="loading" id="loading">
      <div class="spin"></div>
      <div class="spin-lbl">FETCHING LIVE NEWS...</div>
    </div>
    <div id="feed-body" style="display:none">
      <div class="feed-hdr">
        <span class="feed-cat" id="feed-cat-lbl">ALL CATEGORIES</span>
        <span class="feed-cnt" id="feed-cnt">0 articles</span>
      </div>
      <div id="hero-zone"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

</div>

<script>
// ── Clock ──────────────────────────────────────────────────────────────────
(function tick(){
  var n=new Date();
  document.getElementById('tb-clock').textContent=
    n.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'})+
    '  UTC'+(-n.getTimezoneOffset()/60>=0?'+':'')+(-n.getTimezoneOffset()/60);
  setTimeout(tick,1000);
})();

// ── Config ─────────────────────────────────────────────────────────────────
var REFRESH=180;
var data={};
var active='all';
var timer=null,secs=REFRESH;

var META={
  breaking:  {label:'BREAKING',  cc:'cc-breaking', tc:'tc-breaking'},
  world:     {label:'WORLD',     cc:'cc-world',     tc:'tc-world'},
  technology:{label:'TECH',      cc:'cc-technology',tc:'tc-technology'},
  business:  {label:'BUSINESS',  cc:'cc-business',  tc:'tc-business'},
  indonesia: {label:'INDONESIA', cc:'cc-indonesia', tc:'tc-indonesia'},
};

// ── Fetch ──────────────────────────────────────────────────────────────────
function fetchNews(){
  document.getElementById('loading').style.display='flex';
  document.getElementById('feed-body').style.display='none';
  fetch('/api/news/feed')
    .then(function(r){return r.json()})
    .then(function(d){
      data=d;
      buildCounts();
      buildTicker();
      render();
      var now=new Date();
      document.getElementById('sb-updated').textContent=
        now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
      document.getElementById('loading').style.display='none';
      document.getElementById('feed-body').style.display='block';
    })
    .catch(function(){
      document.getElementById('loading').innerHTML=
        '<div class="spin-lbl">⚠ Failed to load. Retrying in 10s...</div>';
      setTimeout(fetchNews,10000);
    });
}

// ── Counts ─────────────────────────────────────────────────────────────────
function buildCounts(){
  var total=0;
  Object.keys(META).forEach(function(cat){
    var n=(data[cat]||[]).length;
    var el=document.getElementById('fn-'+cat);
    if(el)el.textContent=n;
    total+=n;
  });
  document.getElementById('fn-all').textContent=total;
  document.getElementById('sb-count').textContent=total;
}

// ── Ticker ─────────────────────────────────────────────────────────────────
function buildTicker(){
  var items=[];
  Object.keys(META).forEach(function(cat){
    (data[cat]||[]).slice(0,4).forEach(function(a){
      items.push({cat:cat,title:a.title||''});
    });
  });
  if(!items.length)return;
  var html='';
  [items,items].forEach(function(set){
    set.forEach(function(it){
      var m=META[it.cat];
      html+='<span class="tick-item"><span class="tick-cat '+m.tc+'">'+m.label+'</span>'+
            '<span class="tick-title">'+esc(it.title)+'</span></span>';
    });
  });
  var el=document.getElementById('tick-inner');
  el.innerHTML=html;
  el.style.animationDuration=Math.max(40,items.length*6)+'s';
}

// ── Render ─────────────────────────────────────────────────────────────────
function render(){
  var cat=active;
  var lbl=cat==='all'?'ALL CATEGORIES':(META[cat]?META[cat].label:cat.toUpperCase());
  document.getElementById('feed-cat-lbl').textContent=lbl;

  // Collect articles
  var articles=[];
  if(cat==='all'){
    Object.keys(META).forEach(function(c){
      (data[c]||[]).forEach(function(a){articles.push({cat:c,a:a});});
    });
  }else{
    (data[cat]||[]).forEach(function(a){articles.push({cat:cat,a:a});});
  }
  document.getElementById('feed-cnt').textContent=articles.length+' articles';

  // Breaking hero
  var hz=document.getElementById('hero-zone');
  hz.innerHTML='';
  var breaking=data['breaking']||[];
  var heroItem=null;
  if((cat==='all'||cat==='breaking')&&breaking.length){
    heroItem=breaking[0];
    var b=heroItem;
    var aEl=document.createElement('a');
    aEl.href=b.url||'#';aEl.target='_blank';aEl.rel='noopener';aEl.className='hero';
    aEl.innerHTML=
      '<div class="hero-tag"><span class="hero-dot"></span>🔴 BREAKING NEWS</div>'+
      '<div class="hero-hl">'+esc(b.title||'')+'</div>'+
      (b.snippet?'<div class="hero-snip">'+esc(b.snippet)+'</div>':'')+
      '<div class="hero-meta"><b>'+esc(b.source||'')+'</b>'+(b.date?' &nbsp;·&nbsp; '+esc(b.date):'')+' &nbsp;·&nbsp; Read full story →</div>';
    hz.appendChild(aEl);
    if(cat==='all'){articles=articles.filter(function(x){return !(x.cat==='breaking'&&x.a===b);});}
  }

  // Cards
  var grid=document.getElementById('grid');
  grid.innerHTML='';
  if(!articles.length){
    grid.innerHTML='<div class="empty">No articles in this category.<br><span style="font-size:9px;margin-top:4px;display:block">Try refreshing or selecting another topic.</span></div>';
    return;
  }
  articles.forEach(function(item,i){
    var a=item.a,m=META[item.cat]||{label:item.cat.toUpperCase(),cc:'',tc:''};
    var card=document.createElement('a');
    card.href=a.url||'#';card.target='_blank';card.rel='noopener noreferrer';
    card.className='card';
    card.style.animationDelay=(i*25)+'ms';
    var img='';
    if(a.imageUrl){
      img='<img class="card-img" src="'+escAttr(a.imageUrl)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
    }
    card.innerHTML=img+
      '<div class="card-body">'+
        '<span class="card-cat '+m.cc+'">'+m.label+'</span>'+
        '<div class="card-hl">'+esc(a.title||'No title')+'</div>'+
        (a.snippet?'<div class="card-snip">'+esc(a.snippet)+'</div>':'')+
        '<div class="card-meta"><span class="card-src">'+esc(a.source||'')+'</span><span>'+esc(a.date||'')+'</span></div>'+
      '</div>';
    grid.appendChild(card);
  });
}

// ── Filter ─────────────────────────────────────────────────────────────────
document.querySelectorAll('.flt').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.flt').forEach(function(b){b.classList.remove('on')});
    btn.classList.add('on');
    active=btn.dataset.cat;
    render();
  });
});

// ── Countdown ──────────────────────────────────────────────────────────────
function startTimer(){
  clearInterval(timer);
  secs=REFRESH;
  timer=setInterval(function(){
    secs--;
    var pct=(secs/REFRESH)*100;
    document.getElementById('ref-bar').style.width=pct+'%';
    var m=Math.floor(secs/60),s=secs%60;
    document.getElementById('ref-txt').textContent='Next: '+m+':'+(s<10?'0':'')+s;
    if(secs<=0){clearInterval(timer);fetchNews();startTimer();}
  },1000);
}

document.getElementById('ref-btn').addEventListener('click',function(){
  clearInterval(timer);fetchNews();startTimer();
});

// ── Utils ──────────────────────────────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escAttr(s){return esc(s)}
