<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CassanovaL — AI Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
(async () => {
  /* Load each JSX module in dependency order, transform with Babel, run globally */
  const files = ['icons.jsx', 'data.jsx', 'views.jsx', 'overlays.jsx', 'app.jsx'];
  for (const f of files) {
    try {
      const src  = await fetch(f).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
      const code = Babel.transform(src, { presets: ['react'], sourceType: 'script' }).code;
      /* new Function executes in global scope — window.CL* assignments work correctly */
      new Function(code)();
    } catch (err) {
      document.getElementById('root').innerHTML =
        `<div style="font-family:monospace;color:#f5d048;background:#0e0d12;padding:32px;height:100vh">
           <div style="font-size:11px;opacity:.6">BOOT ERROR</div>
           <div style="font-size:20px;margin-top:8px">Failed to load <strong>${f}</strong></div>
           <pre style="margin-top:12px;font-size:12px;color:#9a93a8">${err.message}</pre>
         </div>`;
      return;
    }
  }
})();
</script>
</body>
</html>
